[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ximu3"
version = "1.9.1"
description = "x-IMU3 API"
readme = { text = "See [github](https://github.com/xioTechnologies/x-IMU3-Software) for documentation and examples.", content-type = "text/markdown" }
authors = [{ name = "x-io Technologies Limited", email = "info@x-io.co.uk" }]
license = "MIT"
license-files = ["LICENSE.md"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"]  # versions shown by pyversions badge in README

[project.urls]
Repository = "https://github.com/xioTechnologies/x-IMU3-Software"

[tool.setuptools]
include-package-data = false # exclude _core.c
packages = ["ximu3"]
package-dir = { "ximu3" = "x-IMU3-API/Python/ximu3" }

[tool.setuptools.package-data]
ximu3 = ["py.typed", "*.pyi"]

[[tool.cibuildwheel.overrides]]
select = "cp311-macosx_x86_64"
environment = { MACOSX_DEPLOYMENT_TARGET = "10.12" } # match Rust minimum
